<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TindahanPRO - Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f4f6f9;
      overflow: hidden;
      background-image: url("assets/shoppinggif2.gif");
      background-size: cover;
      transition: background-image 1s ease-in-out;
    }

    nav {
      background: rgba(255, 255, 255, 0.95);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 2px solid black;
    }

    nav .logo img {
      height: 130px;
    }

    .nav-links {
      display: flex;
      gap: 40px;
      margin: 0 auto;
    }

    nav a {
      color: black;
      text-decoration: none;
      font-size: 25px;
      font-weight: bold;
      padding: 15px 20px;
      border-radius: 6px;
      transition: background 0.3s, text-decoration 0.3s, transform: 0.2s ease-in-out;
    }

    nav a:hover {
      background: rgba(0,0,0,0.05);
      text-decoration: underline;
      text-underline-offset: 4px;
      transform: scale(1.1);
    }


    .content {
      padding: 40px;
      text-align: center;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
    }

    .content h1 {
      color: #fff;
    }

    .promo-text {
      position: fixed;
      bottom: 200px;
      left: 20px;
      color: white;
      font-size: 70px;
      font-family: "Helvetica-Neue";
      font-weight: bold;
      text-shadow:
        -2px -2px 0 black,
         2px -2px 0 black,
        -2px  2px 0 black,
         2px  2px 0 black;
    }



  </style>
</head>
<body>

<nav>
  <div class="logo">
    <img src="assets/TindahanPRO-Logo.png" alt="TindahanPRO Logo">
  </div>
  <div class="welcome-text">
  </div>
  <div class="nav-links">
    <a href="products.html">Products</a>
    <a href="checkout.html">Checkout</a>
    <a href="reports.html">Reports</a>
  </div>
</nav>

<div class="promo-text">
  Enjoy 25% off on our grocery items,<br>
  available only until Friday.
  </div>
</body>
</html>
