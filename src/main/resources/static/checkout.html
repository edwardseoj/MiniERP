<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TindahanPRO - Checkout</title>
    <style>
        body {
          font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
          margin: 0;
          background: #f4f6f9;
          color: #111;
        }

        header {
          background: #111154;
          padding: 20px;
          color: white;
          font-size: 28px;
          font-weight: bold;
          text-align: center;
          letter-spacing: 1px;
        }

        .checkout-container {
          max-width: 900px;
          margin: 40px auto;
          background: white;
          border-radius: 12px;
          box-shadow: 0 6px 16px rgba(0,0,0,0.1);
          padding: 30px;
        }

        /* Progress bar */
        .progress {
          display: flex;
          justify-content: space-between;
          margin-bottom: 30px;
        }

        .step {
          flex: 1;
          text-align: center;
          position: relative;
          font-weight: bold;
          color: #aaa;
        }

        .step.active {
          color: #111154;
        }

        .step::after {
          content: "";
          position: absolute;
          top: 12px;
          right: -50%;
          width: 100%;
          height: 4px;
          background: #ddd;
          z-index: -1;
        }

        .step:last-child::after {
          display: none;
        }

        .step.active::after {
          background: #111154;
        }

        /* Cart items */
        .cart-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 15px;
          border-bottom: 1px solid #eee;
          font-size: 18px;
        }

        .cart-item:last-child {
          border-bottom: none;
        }

        .remove-btn {
          background: none;
          border: 2px solid #dc3545;
          color: #dc3545;
          padding: 6px 12px;
          border-radius: 4px;
          cursor: pointer;
          font-weight: bold;
          transition: all 0.2s ease-in-out;
        }

        .remove-btn:hover {
          background: #dc3545;
          color: white;
        }

        .summary {
          text-align: right;
          font-size: 22px;
          font-weight: bold;
          margin-top: 20px;
        }

        .pay-btn {
          display: block;
          width: 100%;
          background: #3BB143;
          color: white;
          padding: 18px;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          font-size: 22px;
          font-weight: bold;
          margin-top: 30px;
          transition: background 0.3s ease-in-out, transform 0.2s ease-in-out;
        }

        .pay-btn:hover {
          background: #007bff;
          transform: scale(1.03);
        }
    </style>
</head>
<body>
<header>TindahanPRO Checkout</header>
<div class="checkout-container">

    <div class="progress">
        <div class="step active">Cart</div>
        <div class="step">Shipping</div>
        <div class="step">Payment</div>
        <div class="step">Confirmation</div>
    </div>


    <div class="cart-item">
        <span>Sample Item</span>
        <span>₱50</span>
        <button class="remove-btn">Remove</button>
    </div>

    <div class="summary">Total: ₱50</div>

    <button class="pay-btn">Proceed to Shipping</button>
</div>
</body>
</html>
